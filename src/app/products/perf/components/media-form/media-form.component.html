<mat-card class="card-in-container">
  <mat-card-content>
    <form class="managed-form" [formGroup]="formGroup">
      <div class="managed-form-scroll">
        <mat-tab-group class="tab-in-card">
          <mat-tab label="媒体方属性">
            <mat-form-field class="full-width-input" subscriptSizing="dynamic">
              <mat-label>媒体方名称</mat-label>
              <input placeholder="媒体方名称" matInput formControlName="name" />
            </mat-form-field>
            <mat-form-field class="full-width-input" subscriptSizing="dynamic">
              <mat-label>媒体方编码</mat-label>
              <input placeholder="媒体方编码" matInput formControlName="code" />
            </mat-form-field>
            <mat-form-field class="full-width-input" subscriptSizing="dynamic">
              <mat-label>协议字段</mat-label>
              <input placeholder="用逗号或空格分隔" matInput formControlName="protocolKey" />
            </mat-form-field>
            <mat-form-field class="full-width-input" subscriptSizing="dynamic">
              <mat-label>密钥字段</mat-label>
              <input placeholder="用逗号或空格分隔，留空表示该媒体的回传不需要签名" matInput formControlName="secretKey" />
              <mat-hint>渠道按这里的顺序填值，仅用于回传签名，不会出现在监测链接里</mat-hint>
            </mat-form-field>
            <mat-form-field class="full-width-input" subscriptSizing="dynamic">
              <mat-label>备注</mat-label>
              <textarea matInput placeholder="备注" formControlName="remark"></textarea>
            </mat-form-field>
          </mat-tab>
        </mat-tab-group>
      </div>
      <div class="full-width-input flex managed-form-actions">
        @if (tenantService.isManager()) {
          <button type="button" class="form-button" mat-stroked-button (click)="saveMedia()">{{ media() === null ? '创建' : '修改' }}</button>
        }
        <button type="button" class="form-button cancel" mat-stroked-button (click)="cancelMedia()">取消</button>
        @if (media() !== null && tenantService.isManager()) {
          <button type="button" class="form-button delete" mat-stroked-button (click)="removeMedia()">删除</button>
        }
      </div>
    </form>
  </mat-card-content>
</mat-card>
