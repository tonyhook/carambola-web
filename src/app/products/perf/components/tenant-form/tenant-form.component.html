<ng-container>
  <mat-card class="card-in-container">
    <mat-card-content>
      <form class="managed-form" [formGroup]="formGroup">
        <div class="managed-form-scroll">
          <mat-tab-group class="tab-in-card">
            <mat-tab label="租户属性">
              <mat-form-field class="full-width-input" subscriptSizing="dynamic">
                <mat-label>租户名称</mat-label>
                <input placeholder="租户名称" matInput formControlName="name" />
              </mat-form-field>

              <mat-form-field class="full-width-input" subscriptSizing="dynamic">
                <mat-label>租户管理员</mat-label>
                <mat-chip-grid #chipGridManager formControlName="manager">
                  @for (user of managerUsers; track user.username) {
                    <mat-chip-row [value]="user" (removed)="remove(user, ctrlManager, managerUsers)">
                      {{ user.username }}
                      <button matChipRemove>
                        <mat-icon>cancel</mat-icon>
                      </button>
                    </mat-chip-row>
                  }
                </mat-chip-grid>
                <input placeholder="增加用户" #inputManager matInput [formControl]="ctrlManager"
                  [matChipInputFor]="chipGridManager" [matAutocomplete]="autoManager"
                  [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                  (matChipInputTokenEnd)="add($event, ctrlManager, managerUsers)" />
                <mat-autocomplete #autoManager="matAutocomplete" (optionSelected)="select($event, inputManager, ctrlManager, managerUsers)">
                  @for (user of filteredManager(); track user.username) {
                    <mat-option [value]="user.username">
                      {{ user.username }}
                    </mat-option>
                  }
                </mat-autocomplete>
              </mat-form-field>

              <mat-checkbox class="full-width-input" formControlName="enabled">启用</mat-checkbox>
            </mat-tab>
          </mat-tab-group>
        </div>
        <div class="full-width-input flex managed-form-actions">
          @if (tenant() === null) {
            <button type="button" class="form-button" mat-stroked-button (click)="addTenant()">创建</button>
            <button type="button" class="form-button cancel" mat-stroked-button (click)="cancelTenant()">取消</button>
          }
          @if (tenant() !== null) {
            @if (!readonly) {
              <button type="button" class="form-button" mat-stroked-button (click)="updateTenant()">修改</button>
            }
            <button type="button" class="form-button cancel" mat-stroked-button (click)="cancelTenant()">取消</button>
            @if (tenantService.isManager()) {
              <button type="button" class="form-button delete" mat-stroked-button (click)="removeTenant()">删除</button>
            }
          }
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</ng-container>
