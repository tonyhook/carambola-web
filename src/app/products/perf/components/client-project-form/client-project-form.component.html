<mat-card class="card-in-container">
  <mat-card-content>
    <form class="managed-form" [formGroup]="formGroup">
      <div class="managed-form-scroll">
        <mat-tab-group class="tab-in-card">
          <mat-tab label="产品属性">
            <mat-form-field class="full-width-input" subscriptSizing="dynamic">
              <mat-label>客户</mat-label>
              <mat-select formControlName="client">
                @for (client of clients(); track client.id) {
                  <mat-option [value]="client">{{ client.name }}</mat-option>
                }
              </mat-select>
            </mat-form-field>

            <mat-form-field class="full-width-input" subscriptSizing="dynamic">
              <mat-label>产品名称</mat-label>
              <input placeholder="产品名称" matInput formControlName="name" />
            </mat-form-field>

            <carambola-perf-user-chip-input formControlName="managers" label="产品管理员" [loadUsers]="canLoadProjectUsers()" />

            <mat-form-field class="full-width-input" subscriptSizing="dynamic">
              <mat-label>备注</mat-label>
              <textarea matInput formControlName="remark" rows="4"></textarea>
            </mat-form-field>
          </mat-tab>
        </mat-tab-group>
      </div>

      <div class="full-width-input flex managed-form-actions">
        @if (canEditProjectDetails() || canEditProjectUsers()) {
          <button type="button" class="form-button" mat-stroked-button (click)="saveClientProject()">{{ clientProject() === null ? '创建' : '修改' }}</button>
        }
        <button type="button" class="form-button cancel" mat-stroked-button (click)="cancelClientProject()">取消</button>
        @if (clientProject() !== null && canRemoveProject()) {
          <button type="button" class="form-button delete" mat-stroked-button (click)="removeClientProject()">删除</button>
        }
      </div>
    </form>
  </mat-card-content>
</mat-card>
